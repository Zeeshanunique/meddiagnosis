model:
  local_id: BIOMEDICA/BMC-smolvlm1-256M
  processor_id: HuggingFaceTB/SmolVLM-256M-Instruct
  max_new_tokens: 128
  classification_max_tokens: 48
  system_prompt: >
    You are an expert radiologist assistant. Provide findings, a concise diagnosis,
    and a brief explanation grounded in visible image evidence. Research use only.

prompts:
  classifier_system_prompt: >
    You are a chest X-ray classification assistant. Answer briefly and precisely.
    Research use only.
  report_generation: >
    Write a short chest X-ray report in plain English (4-6 sentences): lung findings,
    heart/mediastinum, and clinical impression. Do not use numbered labels (1)(2)(3).
  cxr_binary_prompt: >
    Is pneumonia or focal airspace consolidation present on this chest X-ray?
    Answer with exactly one word: yes or no.
  vqa_prompt: >
    Look at this chest X-ray. Answer the question in one clear sentence.
    Question: {question}

xai:
  output_dir: outputs/xai
  alpha: 0.45
  fast: true
  # Downscale before attribution. SmolVLM tiles images (512px tiles, 2048px cap),
  # so a full-size X-ray becomes ~17 crops and the backward pass crashes the Metal
  # compiler on MPS. 512 keeps it to ~2 crops; the heatmap is upsampled anyway.
  max_image_size: 512
  # MPS float16 backward is unstable; run attribution on CPU in float32.
  attribution_device: cpu
  # Vision-encoder block to hook (negative = from the end, 12 blocks total).
  # The last block gives diffuse, answer-agnostic maps; -4 was measured to give
  # focal maps that actually differ between the "yes" and "no" answers.
  layer_index: -4

paths:
  outputs: outputs

disclaimer: Research and educational use only. Not for clinical diagnosis.
